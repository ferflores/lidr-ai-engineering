name: estimador-cag

on:
  push:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  workflow_dispatch:

jobs:
  verificar:
    name: Estructura, tests y arranque del servicio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      # Opcionales: si se definen como secrets del repositorio, el paso 4 del script
      # hace una llamada real al LLM. Sin ellos, se verifica todo lo demás.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv (descarga el Python fijado en .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "estimador-cag/uv.lock"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Verificar estructura, tests y arranque del servicio
        run: bash scripts/verificar.sh

  docker:
    name: Imagen Docker y arranque con compose
    runs-on: ubuntu-latest
    needs: verificar
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen y arrancar el servicio
        run: docker compose up --build -d

      - name: Comprobar /health y /docs
        run: |
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          HEALTH=$(curl -sf http://127.0.0.1:8000/health)
          echo "GET /health -> $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = "200"
          curl -sf http://127.0.0.1:8000/openapi.json | grep -q '"/api/v1/estimate"'

      - name: Logs del contenedor
        if: always()
        run: docker compose logs --no-log-prefix api

      - name: Parar el servicio
        if: always()
        run: docker compose down
