name: estimador-cag

on:
  push:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag.yml"
  workflow_dispatch:

jobs:
  verificar:
    name: Estructura, tests y arranque del servicio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      # Opcionales: si se definen como secrets del repositorio, el paso 4 del script
      # hace una llamada real al LLM. Sin ellos, se verifica todo lo demás.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv (descarga el Python fijado en .python-version)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "estimador-cag/uv.lock"

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Verificar estructura, tests y arranque del servicio
        # Sin PostgreSQL en este job: verificar.sh comprueba la migración en modo offline
        # (`alembic upgrade head --sql`) y omite con un aviso lo que necesita una base viva.
        # El job `docker` de abajo sí la levanta con compose.
        run: bash scripts/verificar.sh

  docker:
    name: Imagen Docker, API y formulario con compose
    runs-on: ubuntu-latest
    needs: verificar
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen y arrancar el servicio
        run: docker compose up --build -d

      - name: Comprobar /health y /docs
        run: |
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          HEALTH=$(curl -sf http://127.0.0.1:8000/health)
          echo "GET /health -> $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = "200"
          curl -sf http://127.0.0.1:8000/openapi.json | grep -q '"/api/v1/estimate"'
          curl -sf http://127.0.0.1:8000/api/v1/prompts | grep -q '"version":"v3"'

      - name: Comprobar las sesiones conversacionales
        run: |
          SESSION=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/sessions)
          echo "POST /api/v1/sessions -> $SESSION"
          echo "$SESSION" | grep -q '"session_id"'
          SID=$(echo "$SESSION" | sed -n 's/.*"session_id":"\([^"]*\)".*/\1/p')
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/sessions/$SID)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/sessions/$SID/estimate -F transcript=corta)" = "422"

      - name: Comprobar el pipeline de embeddings (sesión 07)
        run: |
          curl -sf http://127.0.0.1:8000/openapi.json | grep -q '"/embeddings/ingest"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/embeddings/ingest -H 'Content-Type: application/json' -d '{}')" = "422"
          curl -sf http://127.0.0.1:8000/health | grep -q '"embedding_model":"text-embedding-3-small"'
          # El tokenizador de tiktoken está en la imagen: el chunker funciona sin red ni API key.
          # El script va por stdin para que su indentación no dependa del bloque YAML.
          docker compose exec -T api python < scripts/ci_check_chunker.py

      - name: Aplicar las migraciones y comprobar el esquema (sesión 08)
        run: |
          # `api` solo arranca si postgres está sano (depends_on + healthcheck), así que llegar aquí ya
          # prueba que la base responde.
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic check
          # Las dos tablas, la extensión y la columna vector(1536) existen de verdad.
          docker compose exec -T postgres psql -U estimator -d estimator -tAc \
            "SELECT extname FROM pg_extension WHERE extname = 'vector'" | grep -q vector
          docker compose exec -T postgres psql -U estimator -d estimator -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('documents','chunks')" | grep -q '^2$'
          docker compose exec -T postgres psql -U estimator -d estimator -tAc \
            "SELECT format_type(atttypid, atttypmod) FROM pg_attribute WHERE attrelid = 'chunks'::regclass AND attname = 'embedding'" | grep -q 'vector(1536)'
          # El baseline del directo: ningún índice sobre la columna del vector.
          test "$(docker compose exec -T postgres psql -U estimator -d estimator -tAc \
            "SELECT count(*) FROM pg_indexes WHERE tablename = 'chunks' AND indexdef LIKE '%embedding%'")" = "0"

      - name: Comprobar la búsqueda semántica (sesión 08)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl -sf http://127.0.0.1:8000/openapi.json | grep -q '"/search"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/search -H 'Content-Type: application/json' -d '{"query":"algo","k":0}')" = "422"
          if [ -n "$OPENAI_API_KEY" ]; then
            # Flujo real: ingesta -> 409 al repetir -> búsqueda con resultados.
            # El body se genera con un script por stdin (igual que ci_check_chunker.py).
            docker compose exec -T api python < scripts/ci_make_doc.py > /tmp/doc.json
            curl -sf -X POST http://127.0.0.1:8000/embeddings/ingest -H 'Content-Type: application/json' -d @/tmp/doc.json | grep -q '"chunks_created"'
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/embeddings/ingest -H 'Content-Type: application/json' -d @/tmp/doc.json)" = "409"
            curl -sf -X POST http://127.0.0.1:8000/search -H 'Content-Type: application/json' \
              -d '{"query":"OAuth authentication backend for banking","k":3}' | grep -q '"distance"'
          else
            echo "Sin OPENAI_API_KEY: se comprueba el contrato, no la ingesta real."
          fi

      - name: Comprobar el formulario (Streamlit)
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8501/_stcore/health >/dev/null && break
            sleep 1
          done
          test "$(curl -sf http://127.0.0.1:8501/_stcore/health)" = "ok"

      - name: Logs del contenedor
        if: always()
        run: docker compose logs

      - name: Parar el servicio
        if: always()
        run: docker compose down
