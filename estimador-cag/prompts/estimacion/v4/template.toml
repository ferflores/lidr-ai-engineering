# Metadatos de la plantilla. Los lee app/services/prompts.py (tomllib, sin dependencias).
[prompt]
name = "estimacion"
version = "v4"
description = "v3 + compresión del historial: bloque <anchors> (hechos anclados del cliente) y bloque <summary> (resumen acumulativo de los turnos que salieron de la ventana), ambos al final del system prompt"
created = 2026-10-12
changelog = [
  "Añade la sección 'Hechos anclados' con el bloque <anchors>: hechos cortos extraídos de cada mensaje del usuario (nombre, presupuesto, plazo, stack, requisitos, cambios) que sobreviven a la ventana deslizante",
  "Añade la sección 'Resumen de turnos anteriores' con el bloque <summary>: resumen acumulativo de los turnos que ya no viajan en el historial",
  "Los dos bloques van después de <project_metadata>, al final: el prefijo cacheable (rol, reglas, formato, ejemplos CAG) sigue siendo idéntico al de v3",
  "Regla de conflicto explícita: entre dos hechos anclados contradictorios manda el del turno más alto",
  "El mensaje de usuario es el de v3, sin cambios",
]

# Variables que cada plantilla espera recibir. Si falta alguna, el registro falla antes de llamar al LLM.
[variables]
system = ["examples", "project_metadata", "anchors", "summary"]
user = ["transcription", "project_name", "project_type", "hourly_rate_eur", "deadline_weeks", "estimation_mode", "detail_level"]
