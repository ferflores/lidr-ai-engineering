services:
  # PostgreSQL 16 con la extensión pgvector precompilada (sesión 08). Es la imagen oficial del proyecto
  # pgvector: la extensión se instala con un solo `CREATE EXTENSION IF NOT EXISTS vector`, que hace la
  # primera migración de Alembic. Sin índice vectorial: lo añade el directo (ver README).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: estimador-cag-postgres
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      - "5432:5432"   # expuesto para poder inspeccionar la base con psql desde el host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: estimador-cag:latest
    container_name: estimador-cag
    # Configuración y API keys: se leen de .env en el arranque, nunca se copian a la imagen.
    env_file:
      - path: .env
        required: false   # sin .env el servicio arranca, pero /api/v1/estimate responde 500 hasta configurar la key
    environment:
      # Dentro de la red de compose el host es el nombre del servicio. Sobrescribe el DATABASE_URL del .env,
      # que apunta a localhost para el desarrollo con `uv run`.
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator
      # Para los scripts que hablan con la API por HTTP (`docker compose run --rm api python query_examples.py`):
      # un contenedor de `run` no ejecuta uvicorn, así que tiene que llamar al servicio `api` por su nombre,
      # no a su propio localhost. El servidor de este servicio no usa esta variable.
      API_BASE_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy   # el contenedor no arranca hasta que pg_isready responde
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Desarrollo: `docker compose watch` sincroniza app/ y prompts/ al contenedor y lo reinicia al
    # guardar; si cambian las dependencias, reconstruye la imagen.
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: sync+restart
          path: ./prompts
          target: /app/prompts
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

  # Interfaz web (Streamlit), misma imagen. Habla con la API por HTTP (sesiones, memoria y adjuntos viven en la API).
  chat:
    build: .
    image: estimador-cag:latest
    container_name: estimador-cag-chat
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000   # nombre del servicio en la red de compose (sobrescribe el .env)
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator
    depends_on:
      - api
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: sync+restart
          path: ./prompts
          target: /app/prompts
        - action: sync+restart
          path: ./streamlit_app.py
          target: /app/streamlit_app.py

volumes:
  # Los datos de Postgres sobreviven a `docker compose down`; `docker compose down -v` los borra.
  postgres_data:
