[project]
name = "estimador-cag"
version = "0.1.0"
description = "Estimador de software con FastAPI + LLM (arquitectura CAG) — Proyecto 1 del curso AI Engineering de Lidr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "openai>=3.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
